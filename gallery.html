<title>Orbitron Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0c0f; --void-2:#111318; --panel:#15171d; --ink:#e9e3d6; --ink-dim:#a9a49a;
    --gold:#c9a24b; --ninja:#3ecf8e; --clone:#d15a4a;
    --display:'Cinzel',Georgia,serif; --mono:'JetBrains Mono','Courier New',monospace;
    --border:rgba(233,227,214,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--void); color:var(--ink); font-family:var(--mono); min-height:100%;}
  ::selection{ background:rgba(201,162,75,.5); color:#0a0c0f; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  /* ---------------- top bar ---------------- */
  .topbar{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:.9rem;
    padding:.9rem 1.2rem; background:rgba(10,12,15,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .burger{
    all:unset; cursor:pointer; width:38px; height:38px; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:5px; border:1px solid var(--border); border-radius:6px;
    flex-shrink:0;
  }
  .burger span{ width:18px; height:2px; background:var(--ink); border-radius:2px; transition:transform .2s, opacity .2s; }
  .burger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  .brand{ font-family:var(--display); font-weight:600; letter-spacing:.06em; font-size:1.05rem; white-space:nowrap; }
  .brand b{ color:var(--gold); }
  .topbar .crumb{ font-size:.72rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar .spacer{ flex:1; }
  .topbar .count{ font-size:.7rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ---------------- drawer ---------------- */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:45; opacity:0; visibility:hidden; transition:opacity .25s; }
  .scrim.show{ opacity:1; visibility:visible; }
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(320px, 84vw); z-index:50;
    background:var(--panel); border-right:1px solid var(--border);
    transform:translateX(-100%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
    overflow-y:auto; padding:1.2rem 0 2rem;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:0 1.2rem 1rem; border-bottom:1px solid var(--border); margin-bottom:.6rem; }
  .drawer-head .brand{ font-size:1.15rem; }
  .drawer-head .sub{ font-size:.68rem; color:var(--ink-dim); letter-spacing:.1em; text-transform:uppercase; margin-top:.3rem; }
  .drawer-group{ padding:.9rem 1.2rem .3rem; font-family:var(--display); font-size:.85rem; letter-spacing:.05em; }
  .drawer-group.ninja{ color:var(--ninja); }
  .drawer-group.clone{ color:var(--clone); }
  .drawer-item{
    all:unset; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    width:100%; padding:.62rem 1.2rem; font-size:.82rem; color:var(--ink); border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .drawer-item:hover{ background:rgba(255,255,255,.04); }
  .drawer-item.active{ background:rgba(255,255,255,.06); border-left-color:var(--gold); color:var(--gold); }
  .drawer-item .n{ font-family:var(--mono); font-size:.7rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
  .drawer-item.active .n{ color:var(--gold); }

  /* ---------------- landing (no section chosen) ---------------- */
  .landing{ max-width:980px; margin:0 auto; padding:clamp(2rem,6vw,4.5rem) 1.2rem 3rem; text-align:center; }
  .landing h1{ font-family:var(--display); font-weight:700; font-size:clamp(1.8rem,5vw,3rem); margin:0 0 .5rem; text-wrap:balance; }
  .landing h1 b{ color:var(--gold); }
  .landing p{ color:var(--ink-dim); font-size:.92rem; max-width:52ch; margin:0 auto 2.4rem; line-height:1.6; }
  .landing-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; text-align:left; }
  .land-card{
    all:unset; cursor:pointer; display:block; padding:1.3rem 1.2rem; border-radius:10px;
    background:var(--panel); border:1px solid var(--border); position:relative; overflow:hidden;
    transition:transform .18s, border-color .18s;
  }
  .land-card:hover{ transform:translateY(-3px); border-color:var(--gold); }
  .land-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .land-card.ninja::before{ background:var(--ninja); }
  .land-card.clone::before{ background:var(--clone); }
  .land-card .stack{ font-family:var(--display); font-size:1rem; font-weight:600; }
  .land-card.ninja .stack{ color:var(--ninja); }
  .land-card.clone .stack{ color:var(--clone); }
  .land-card .label{ font-size:.82rem; color:var(--ink); margin-top:.25rem; }
  .land-card .count{ margin-top:.7rem; font-size:.68rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; }

  /* ---------------- section toolbar ---------------- */
  .toolbar{
    display:none; gap:.7rem; align-items:center; flex-wrap:wrap; padding:1rem 1.2rem;
    border-bottom:1px solid var(--border); position:sticky; top:58px; z-index:30; background:rgba(10,12,15,.86); backdrop-filter:blur(10px);
  }
  .toolbar.show{ display:flex; }
  .search{
    flex:1; min-width:160px; background:var(--void-2); border:1px solid var(--border); border-radius:6px;
    color:var(--ink); padding:.5rem .7rem; font-family:var(--mono); font-size:.8rem;
  }
  .search:focus{ outline:none; border-color:var(--gold); }
  .chips{ display:flex; gap:.4rem; flex-wrap:wrap; }
  .chip{
    all:unset; cursor:pointer; font-size:.68rem; padding:.35rem .65rem; border-radius:20px;
    border:1px solid var(--border); color:var(--ink-dim); letter-spacing:.03em; white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .chip:hover{ color:var(--ink); }
  .chip.on{ border-color:var(--gold); color:var(--gold); }
  .view-toggle{ display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; flex-shrink:0; }
  .view-toggle button{
    all:unset; cursor:pointer; font-size:.68rem; padding:.5rem .8rem; color:var(--ink-dim); letter-spacing:.04em;
  }
  .view-toggle button.on{ background:rgba(201,162,75,.14); color:var(--gold); }

  /* ---------------- grid ---------------- */
  .gridwrap{ padding:1.2rem; max-width:1600px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .card{
    position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; cursor:pointer;
    background:var(--panel); border:1px solid var(--border);
  }
  .card img{ width:100%; height:100%; object-fit:cover; transition:transform .3s; }
  .card:hover img{ transform:scale(1.06); }
  .card .tag{
    position:absolute; left:0; right:0; bottom:0; padding:.4rem .5rem .35rem;
    font-size:.62rem; color:var(--ink); background:linear-gradient(0deg, rgba(0,0,0,.85), transparent);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .empty{ text-align:center; color:var(--ink-dim); padding:3rem 1rem; font-size:.85rem; }

  /* ---------------- list view (hrefs + descriptions) ---------------- */
  .listwrap{ display:none; }
  .list-row{
    display:grid; grid-template-columns:64px 1fr; gap:.8rem; padding:.7rem .5rem;
    border-bottom:1px solid var(--border); align-items:start;
  }
  .list-row img{ width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
  .list-row .fn{ font-family:var(--display); font-size:.85rem; color:var(--gold); word-break:break-word; }
  .list-row .cat{ font-size:.64rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:.15rem; }
  .list-row .desc{ font-size:.76rem; color:var(--ink); margin-top:.35rem; line-height:1.5; }
  .list-row .hrefrow{ display:flex; gap:.4rem; align-items:center; margin-top:.45rem; }
  .list-row .href{
    font-size:.68rem; color:var(--ink-dim); background:var(--void-2); border:1px solid var(--border);
    border-radius:5px; padding:.32rem .55rem; flex:1; overflow-x:auto; white-space:nowrap;
    user-select:all; -webkit-user-select:all;
  }
  .list-row .copybtn{
    all:unset; cursor:pointer; font-size:.65rem; color:var(--ink-dim); border:1px solid var(--border);
    border-radius:5px; padding:.32rem .55rem; flex-shrink:0; transition:color .15s, border-color .15s;
  }
  .list-row .copybtn:hover{ color:var(--gold); border-color:var(--gold); }
  .list-row .copybtn.copied{ color:var(--gold); border-color:var(--gold); }

  /* ---------------- modal ---------------- */
  .modal{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(6,7,9,.92); padding:2rem 1rem; backdrop-filter:blur(4px);
  }
  .modal.show{ display:flex; }
  .modal-inner{ max-width:min(920px,94vw); max-height:90vh; display:flex; flex-direction:column; gap:.8rem; }
  .modal-inner img{ max-height:66vh; width:auto; margin:0 auto; border-radius:8px; border:1px solid var(--border); }
  .modal-meta{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem 1.2rem; }
  .modal-meta .fn{ font-family:var(--display); font-size:1.05rem; color:var(--gold); word-break:break-word; }
  .modal-meta .cat{ font-size:.68rem; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; margin-top:.3rem; }
  .modal-meta .desc{ font-size:.82rem; color:var(--ink); margin-top:.6rem; line-height:1.55; }
  .modal-meta .tags{ margin-top:.6rem; display:flex; gap:.35rem; flex-wrap:wrap; }
  .modal-meta .tags span{ font-size:.62rem; padding:.2rem .5rem; border-radius:12px; border:1px solid var(--border); color:var(--ink-dim); }
  .modal-close{
    all:unset; position:absolute; top:1.1rem; right:1.2rem; cursor:pointer; width:36px; height:36px;
    border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); font-size:1rem;
  }
  .modal-close:hover{ color:var(--gold); border-color:var(--gold); }

  @media (max-width:640px){
    .brand{ font-size:.9rem; }
    .toolbar{ top:54px; }
    .grid{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px; }
  }
</style>

  var SECTION_META = {
    'ninjago-curated': { title: 'Nexus Ninjas · Kapitel-Bilder' },
    'ninjago-bonus': { title: 'Nexus Ninjas · Bonus-Archiv' },
    'clonewars-curated': { title: 'Die Akademie · Kapitel-Bilder' },
    'clonewars-bonus': { title: 'Die Akademie · Bonus-Archiv' },
  };

  var burgerBtn = document.getElementById('burgerBtn');
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var landing = document.getElementById('landing');
  var toolbar = document.getElementById('toolbar');
  var gridwrap = document.getElementById('gridwrap');
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var listwrap = document.getElementById('listwrap');
  var listRows = document.getElementById('listRows');
  var listEmpty = document.getElementById('listEmpty');
  var viewGridBtn = document.getElementById('viewGridBtn');
  var viewListBtn = document.getElementById('viewListBtn');
  var searchInput = document.getElementById('search');
  var chipsWrap = document.getElementById('chips');
  var crumb = document.getElementById('crumb');
  var topCount = document.getElementById('topCount');

  var activeSection = null;
  var activeCategory = 'Alle';
  var searchTerm = '';
  var viewMode = 'grid';

  function setView(mode){
    viewMode = mode;
    viewGridBtn.classList.toggle('on', mode === 'grid');
    viewListBtn.classList.toggle('on', mode === 'list');
    gridwrap.style.display = (mode === 'grid' && activeSection) ? 'block' : 'none';
    listwrap.style.display = (mode === 'list' && activeSection) ? 'block' : 'none';
    renderActive();
  }
  viewGridBtn.addEventListener('click', function(){ setView('grid'); });
  viewListBtn.addEventListener('click', function(){ setView('list'); });

  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('show'); burgerBtn.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('show'); burgerBtn.classList.remove('open'); }
  burgerBtn.addEventListener('click', function(){ drawer.classList.contains('open') ? closeDrawer() : openDrawer(); });
  scrim.addEventListener('click', closeDrawer);

  function renderChips(items){
    var cats = ['Alle'].concat(Array.from(new Set(items.map(function(i){ return i.c; }))).sort());
    chipsWrap.innerHTML = '';
    cats.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'chip' + (c === activeCategory ? ' on' : '');
      b.textContent = c;
      b.addEventListener('click', function(){ activeCategory = c; renderActive(); renderChips(items); });
      chipsWrap.appendChild(b);
    });
  }

  function matches(item){
    if (activeCategory !== 'Alle' && item.c !== activeCategory) return false;
    if (!searchTerm) return true;
    var hay = (item.f + ' ' + item.c + ' ' + item.d + ' ' + item.t.join(' ')).toLowerCase();
    return hay.indexOf(searchTerm) !== -1;
  }

  function renderGrid(){
    var items = DATA[activeSection] || [];
    var filtered = items.filter(matches);
    grid.innerHTML = '';
    empty.style.display = filtered.length ? 'none' : 'block';
    var frag = document.createDocumentFragment();
    filtered.forEach(function(item){
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<img src="' + item.u + '" alt="' + item.f.replace(/"/g,'') + '" loading="lazy">' +
        '<div class="tag">' + item.c + '</div>';
      card.addEventListener('click', function(){ openModal(item); });
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function renderList(){
    var items = DATA[activeSection] || [];
    var filtered = items.filter(matches);
    listRows.innerHTML = '';
    listEmpty.style.display = filtered.length ? 'none' : 'block';
    var frag = document.createDocumentFragment();
    filtered.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML =
        '<img src="' + item.u + '" alt="' + item.f.replace(/"/g,'') + '" loading="lazy">' +
        '<div>' +
          '<div class="fn">' + escapeHtml(item.f) + '</div>' +
          '<div class="cat">' + escapeHtml(item.c) + '</div>' +
          (item.d ? '<div class="desc">' + escapeHtml(item.d) + '</div>' : '') +
          '<div class="hrefrow">' +
            '<div class="href">' + escapeHtml(item.u) + '</div>' +
            '<button class="copybtn">Kopieren</button>' +
          '</div>' +
        '</div>';
      var copyBtn = row.querySelector('.copybtn');
      copyBtn.addEventListener('click', function(){
        var done = function(){
          copyBtn.textContent = 'Kopiert ✓';
          copyBtn.classList.add('copied');
          setTimeout(function(){ copyBtn.textContent = 'Kopieren'; copyBtn.classList.remove('copied'); }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(item.u).then(done, done);
        } else {
          done();
        }
      });
      frag.appendChild(row);
    });
    listRows.appendChild(frag);
  }

  function renderActive(){
    if (!activeSection) return;
    if (viewMode === 'list') renderList(); else renderGrid();
  }

  function selectSection(id){
    activeSection = id;
    activeCategory = 'Alle';
    searchTerm = '';
    searchInput.value = '';
    viewMode = 'grid';
    viewGridBtn.classList.add('on');
    viewListBtn.classList.remove('on');
    landing.style.display = 'none';
    toolbar.classList.add('show');
    gridwrap.style.display = 'block';
    listwrap.style.display = 'none';
    crumb.textContent = SECTION_META[id].title;
    topCount.textContent = DATA[id].length + ' Bilder';
    document.querySelectorAll('.drawer-item').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-section') === id);
    });
    renderChips(DATA[id]);
    renderActive();
    closeDrawer();
    if (window.scrollTo) { try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch(e) {} }
  }

  document.querySelectorAll('[data-section]').forEach(function(el){
    el.addEventListener('click', function(){ selectSection(el.getAttribute('data-section')); });
  });

  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value.trim().toLowerCase();
    renderActive();
  });

  // ---------------- modal ----------------
  var modal = document.getElementById('modal');
  var modalImg = document.getElementById('modalImg');
  var modalFn = document.getElementById('modalFn');
  var modalCat = document.getElementById('modalCat');
  var modalDesc = document.getElementById('modalDesc');
  var modalTags = document.getElementById('modalTags');
  var modalClose = document.getElementById('modalClose');

  function openModal(item){
    modalImg.src = item.u;
    modalImg.alt = item.f;
    modalFn.textContent = item.f;
    modalCat.textContent = item.c;
    modalDesc.textContent = item.d;
    modalTags.innerHTML = '';
    item.t.forEach(function(t){
      var s = document.createElement('span');
      s.textContent = t;
      modalTags.appendChild(s);
    });
    modal.classList.add('show');
  }
  function closeModal(){ modal.classList.remove('show'); }
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
})();
</script>
